name: Publicar Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID con el artefacto isekai-politica-final"
        required: true
        default: "42716697736"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar artefacto final
        uses: actions/download-artifact@v4
        with:
          name: isekai-politica-final
          path: out
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          git push origin :refs/tags/v1.0.0 || true
          gh release create v1.0.0 out/video.mp4 \
            --title "Isekai Politica - Video Final 60s" \
            --notes "Video final 2D renderizado (1080x1920 @ 60fps, 3600 frames exactos, audio masterizado EBU R128)."
